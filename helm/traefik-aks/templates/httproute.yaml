{{- if .Values.global.useApplicationGatewayForContainers }}
---
# HTTPRoute for Traefik Dashboard via Application Gateway for Containers
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: {{ include "traefik-aks.fullname" . }}-dashboard-route
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "traefik-aks.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.global.applicationGatewayForContainers.name }}
      namespace: {{ .Values.global.applicationGatewayForContainers.namespace }}
  hostnames:
    - traefik.{{ .Values.global.domainSuffix }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dashboard
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ include "traefik-aks.fullname" . }}-dashboard
          namespace: {{ .Release.Namespace }}
          port: 8080
          weight: 100
{{- end }}
