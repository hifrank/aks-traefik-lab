{{- if .Values.global.useApplicationGatewayForContainers }}
---
# Gateway API Gateway resource for Application Gateway for Containers
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: {{ .Values.global.applicationGatewayForContainers.name }}
  namespace: {{ .Values.global.applicationGatewayForContainers.namespace }}
  annotations:
    alb.networking.azure.io/alb-name: {{ .Values.global.applicationGatewayForContainers.name }}
    alb.networking.azure.io/alb-namespace: {{ .Values.global.applicationGatewayForContainers.namespace }}
spec:
  gatewayClassName: {{ .Values.global.applicationGatewayForContainers.className }}
  listeners:
  - name: http-listener
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
  - name: https-listener
    port: 443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: gateway-tls-secret
        namespace: {{ .Values.global.applicationGatewayForContainers.namespace }}
{{- end }}
