# Sample Application IngressRoute
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: sample-app-ingress
  namespace: sample-app
  labels:
    app: sample-app
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sample-app.example.com`)
      kind: Rule
      services:
        - name: sample-app-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: traefik
        - name: compress
          namespace: traefik
        - name: rate-limit
          namespace: traefik
    - match: Host(`sample-app.example.com`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: sample-app-service
          port: 80
      middlewares:
        - name: cors
          namespace: traefik
        - name: rate-limit
          namespace: traefik
        - name: retry
          namespace: traefik
  tls:
    - secretName: sample-app-tls
---
# Alternative HTTP IngressRoute (will redirect to HTTPS)
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: sample-app-ingress-http
  namespace: sample-app
  labels:
    app: sample-app
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`sample-app.example.com`)
      kind: Rule
      services:
        - name: sample-app-service
          port: 80
      middlewares:
        - name: redirect-to-https
          namespace: traefik
---
# Azure Application Gateway Ingress for comparison
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-app-agic
  namespace: sample-app
  labels:
    app: sample-app
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/use-private-ip: "false"
    appgw.ingress.kubernetes.io/backend-path-prefix: "/"
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    appgw.ingress.kubernetes.io/connection-draining: "true"
    appgw.ingress.kubernetes.io/connection-draining-timeout: "30"
    appgw.ingress.kubernetes.io/cookie-based-affinity: "false"
    appgw.ingress.kubernetes.io/request-timeout: "30"
spec:
  rules:
    - host: sample-app-agic.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sample-app-service
                port:
                  number: 80
  tls:
    - hosts:
        - sample-app-agic.example.com
      secretName: sample-app-agic-tls
